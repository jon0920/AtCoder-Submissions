name: AtCoder Submits

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch AtCoder Submissions
        env:
          ATCODER_USER: 'jon0920'
        run: |
          python -c "
          import os, requests, time

          user_id = os.environ['ATCODER_USER']
          url = f'https://kenkoooo.com/atcoder/atcoder-api/v3/user/submissions?user={user_id}&from_second=0'
          
          headers = {'User-Agent': 'Mozilla/5.0'}
          res = requests.get(url, headers=headers)
          if res.status_code != 200:
              print('API Fetch failed')
              exit(1)

          submissions = res.json()
          ac_submissions = [s for s in submissions if s.get('result') == 'AC']
          print(f'Total AC Submissions found: {len(ac_submissions)}')

          saved_count = 0
          for idx, sub in enumerate(ac_submissions, 1):
              contest_id = sub['contest_id']
              problem_id = sub['problem_id']
              sub_id = sub['id']
              lang = sub.get('language', '')
              
              ext = '.cpp'
              if 'Python' in lang or 'PyPy' in lang:
                  ext = '.py'
              elif 'C#' in lang:
                  ext = '.cs'
              elif 'Java' in lang:
                  ext = '.java'
              elif 'C' in lang and 'C++' not in lang:
                  ext = '.c'

              dir_path = os.path.join('submissions', contest_id)
              os.makedirs(dir_path, exist_ok=True)
              file_path = os.path.join(dir_path, f'{problem_id}_{sub_id}{ext}')

              if os.path.exists(file_path):
                  continue

              # Rawコード取得用URL
              code_url = f'https://atcoder.jp/contests/{contest_id}/submissions/{sub_id}/backend/raw'
              try:
                  code_res = requests.get(code_url, headers=headers, timeout=10)
                  if code_res.status_code == 200 and code_res.text.strip():
                      with open(file_path, 'w', encoding='utf-8') as f:
                          f.write(code_res.text)
                      saved_count += 1
                      print(f'[{idx}/{len(ac_submissions)}] Saved: {file_path}')
                  else:
                      print(f'[{idx}/{len(ac_submissions)}] Failed status: {code_res.status_code} for {sub_id}')
                  time.sleep(1)
              except Exception as e:
                  print(f'Error fetching {sub_id}: {e}')
                  continue

          print(f'Finished. Total new files saved: {saved_count}')
          "

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "Auto update AtCoder submissions"
            git push
          else
            echo "No changes to commit"
          fi
